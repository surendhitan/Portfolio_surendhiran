# Render Blueprint Configuration (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Static Site (Recommended for Portfolios - Free tier with automatic SSL & CDN)
  - type: web
    name: surendhiran-portfolio
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

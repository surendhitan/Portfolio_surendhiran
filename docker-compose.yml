version: "3.9"

# ═══════════════════════════════════════════════════
#  Docker Compose — Portfolio Production Stack
#  Domain  : https://surendhiran.dev.com
#  TLS/SSL : ssl/surendhiran.dev.com.crt/.key
# ═══════════════════════════════════════════════════

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio:latest
    container_name: portfolio_app

    # Bind ports 80 + 443 on host
    ports:
      - "80:80"        # HTTP  → nginx redirects to HTTPS
      - "443:443"      # HTTPS → https://surendhiran.dev.com

    restart: unless-stopped

    # Mount SSL certs as read-only volume (more secure than baking in)
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

    environment:
      - NGINX_HOST=surendhiran.dev.com
      - NGINX_PORT=443

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    labels:
      - "app=portfolio"
      - "domain=surendhiran.dev.com"
      - "url=https://surendhiran.dev.com/"
      - "ssl=enabled"
      - "tls=1.2+1.3"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: portfolio-net
    driver: bridge

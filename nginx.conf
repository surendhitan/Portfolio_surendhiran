# ─── HTTP → HTTPS redirect ────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Redirect ALL HTTP traffic → https://surendhiran.dev.com/
    return 301 https://surendhiran.dev.com$request_uri;
}

# ─── HTTPS main server ────────────────────────────────
server {
    listen 443 ssl default_server;
    server_name surendhiran.dev.com;

    root  /usr/share/nginx/html;
    index index.html;

    # SSL Certificate paths
    ssl_certificate     /etc/nginx/ssl/surendhiran.dev.com.crt;
    ssl_certificate_key /etc/nginx/ssl/surendhiran.dev.com.key;

    # Strong SSL settings (TLS 1.2 + 1.3 only)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                            always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy    "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'" always;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml image/jpeg;

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for 30 days
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }
}
